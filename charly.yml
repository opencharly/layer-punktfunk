version: 2026.240.1943
punktfunk:
    candy:
        version: 2026.241.1845
        description: |
            Punktfunk streaming host — the `punktfunk/1` QUIC host daemon, its browser
            console and its plugin runner, installed from unom's signed pacman repository
            on Arch and CachyOS. Lands three packages (`punktfunk-host`, `punktfunk-web`,
            `punktfunk-scripting`), the `[punktfunk]` repo stanza with its locally-signed
            release key, and a `host.env` policy file that pins the wlroots compositor
            backend, the virtual video source and the software encoder so the host runs
            on a headless seat with no GPU.

            Two service forms ship side by side because punktfunk is a systemd USER
            service upstream: the packaged `punktfunk-host` / `punktfunk-web` /
            `punktfunk-scripting` units are enabled on a systemd venue, while a container
            venue runs the host through a charly-owned wrapper that waits for sway's IPC
            socket first — punktfunk creates its virtual output via `swaymsg create_output`,
            so without SWAYSOCK there is no display to capture.

            The management REST API answers on 47990 and the web console on 47992, both
            HTTPS with a self-signed certificate; the native QUIC control plane is UDP
            9777. Probing and managing a running host is the `punktfunk:` check verb
            (`/charly-check:punktfunk`), which discovers the bearer token this candy's
            install leaves at `~/.config/punktfunk/mgmt-token`.
        distro:
            # `arch` covers BOTH arch and cachyos — the cachyos base declares
            # `distro: [cachyos, arch]`, so the cascade resolves this section on either.
            arch:
                package:
                    - punktfunk-host
                    - punktfunk-web
                    - punktfunk-scripting
                repo:
                    - name: punktfunk
                      # `$repo` / `$arch` are PACMAN variables, not shell ones: the pac
                      # install template emits this line inside a single-quoted printf,
                      # so they reach /etc/pacman.conf verbatim and pacman expands them.
                      server: "https://git.unom.io/api/packages/unom/arch/$repo/$arch"
                      key: "https://git.unom.io/api/packages/unom/arch/repository.key"
                      siglevel: "Required DatabaseOptional"
        port:
            # Native punktfunk/1 QUIC control plane. The video data plane is an ephemeral
            # UDP port the client hole-punches, so it needs no declaration.
            - udp:9777
            # Management REST API and browser console — both HTTPS with a self-signed
            # cert, hence https+insecure (plain http proxying to HTTPS 404s).
            - "https+insecure:47990"
            - "https+insecure:47992"
        service:
            # Form 1 — the packaged USER units, for a systemd venue (VM / host deploy).
            # Upstream ships punktfunk as `systemctl --user`; scope: user preserves that.
            - name: punktfunk-host
              use_packaged: punktfunk-host.service
              scope: user
              enable: true
            - name: punktfunk-web
              use_packaged: punktfunk-web.service
              scope: user
              enable: true
            - name: punktfunk-scripting
              use_packaged: punktfunk-scripting.service
              scope: user
              enable: true
            # Form 2 — the container venue. Mirrors pod-wayvnc's wrapper pattern: the
            # same compositor dependency (sway's IPC socket) and the same solution, so
            # there is one readiness idiom in the repo rather than two.
            - name: punktfunk-host
              exec: "%(ENV_HOME)s/.local/bin/punktfunk-host-wrapper"
              env:
                WAYLAND_DISPLAY: wayland-0
                XDG_RUNTIME_DIR: /tmp
              restart: always
              # After sway (priority 10) and alongside wayvnc (20) — punktfunk needs the
              # compositor up before it can create its virtual output.
              priority: 25
              start_sec: 0
              enable: true
              scope: system
            # The console, for the same reason: punktfunk-web is a packaged USER unit, so a
            # container venue would otherwise install the package, advertise 47992 and never
            # start anything on it.
            - name: punktfunk-web
              exec: "%(ENV_HOME)s/.local/bin/punktfunk-web-wrapper"
              env:
                XDG_RUNTIME_DIR: /tmp
              restart: always
              # After the host (25): the console fails closed without the host's mgmt token.
              priority: 30
              start_sec: 0
              enable: true
              scope: system
            - name: punktfunk-scripting
              exec: "%(ENV_HOME)s/.local/bin/punktfunk-scripting-wrapper"
              env:
                XDG_RUNTIME_DIR: /tmp
              restart: always
              priority: 35
              start_sec: 0
              enable: true
              scope: system
        plan:
            - run: create the user's local bin directory
              mkdir: "${HOME}/.local/bin"
              run_as: "${USER}"
            - run: install the punktfunk-host launcher wrapper for the container venue
              copy: punktfunk-host-wrapper
              to: "${HOME}/.local/bin/punktfunk-host-wrapper"
              mode: "0755"
              run_as: "${USER}"
            - run: install the web-console launcher wrapper for the container venue
              copy: punktfunk-web-wrapper
              to: "${HOME}/.local/bin/punktfunk-web-wrapper"
              mode: "0755"
              run_as: "${USER}"
            - run: install the plugin-runner launcher wrapper for the container venue
              copy: punktfunk-scripting-wrapper
              to: "${HOME}/.local/bin/punktfunk-scripting-wrapper"
              mode: "0755"
              run_as: "${USER}"
            - run: create the punktfunk config directory
              mkdir: "${HOME}/.config/punktfunk"
              run_as: "${USER}"
            - run: write the host.env policy file pinning the headless capture path
              write: "${HOME}/.config/punktfunk/host.env"
              mode: "0644"
              run_as: "${USER}"
              content: |
                # Managed by charly (layer-punktfunk). punktfunk reads this file only at
                # start, so an edit needs a `systemctl --user restart punktfunk-host`.
                #
                # Pin the wlroots backend explicitly rather than letting the host
                # auto-detect: auto-detection picks whatever compositor is live, which
                # makes a check bed's result depend on the venue instead of the config.
                PUNKTFUNK_COMPOSITOR=wlroots
                PUNKTFUNK_INPUT_BACKEND=wlr
                # A virtual (not mirrored) source is what makes the host create its own
                # output at the client's resolution — the whole point of punktfunk.
                PUNKTFUNK_VIDEO_SOURCE=virtual
                # Software H.264 + no zero-copy: upstream calls this an emergency
                # fallback for daily use, but it is the ONLY encoder path that is honest
                # on a GPU-less bed. A GPU deploy overrides both in its own overlay.
                PUNKTFUNK_ENCODER=software
                PUNKTFUNK_ZEROCOPY=0
                # Bind the management API to loopback. The console (47992) is the
                # network-facing surface; the API stays local unless deliberately opened.
                PUNKTFUNK_MGMT_BIND=127.0.0.1:47990
            - run: enable systemd user lingering so the packaged user units run without a login
              # punktfunk ships as a systemd USER service, and a `scope: user` unit only
              # runs without an interactive login if the account lingers. punktfunk's own
              # always-on recipe says so explicitly ("sudo loginctl enable-linger $USER"),
              # so this is part of installing it correctly, not a bed-specific fixup —
              # charly's deploy path does not enable lingering on its own.
              #
              # CAPABILITY-gated, not distro-gated: /run/systemd/system is the canonical
              # "systemd is the running init" test. It is absent during an image build and
              # in a supervisord container, where there are no user units to run anyway, so
              # the step correctly no-ops there instead of failing.
              command: |
                if [ -d /run/systemd/system ] && command -v loginctl >/dev/null 2>&1; then
                  PF_USER="$(getent passwd 1000 | cut -d: -f1)"
                  if [ -n "$PF_USER" ]; then
                    loginctl enable-linger "$PF_USER"
                    echo "punktfunk: lingering enabled for $PF_USER"
                  fi
                else
                  echo "punktfunk: no running systemd — skipping lingering (no user units here)"
                fi
              run_as: root
            - run: join the deploying user to the input group for full controller support
              # `getent passwd 1000` rather than $USER — a RUN shell does not export USER,
              # and this resolves identically under create-mode (`user`) and adopt-mode
              # (`arch`, `cachy`) images.
              command: |
                getent group input >/dev/null 2>&1 || groupadd -r input
                PF_USER="$(getent passwd 1000 | cut -d: -f1)"
                if [ -n "$PF_USER" ]; then usermod -aG input "$PF_USER"; fi
              run_as: root

            - check: the punktfunk host daemon binary is installed at /usr/bin/punktfunk-host
              file:
                file: /usr/bin/punktfunk-host
                exists: true
            - check: the punktfunk-host package is recorded in the package database
              id: punktfunk-host-package
              package:
                package: punktfunk-host
                installed: true
            - check: the punktfunk-web console package is recorded in the package database
              id: punktfunk-web-package
              package:
                package: punktfunk-web
                installed: true
            - check: the punktfunk-scripting plugin runner package is recorded in the package database
              id: punktfunk-scripting-package
              package:
                package: punktfunk-scripting
                installed: true
            - check: the host daemon reports its version without needing a compositor
              id: punktfunk-host-version
              exit_status: 0
              command: /usr/bin/punktfunk-host --version
            - check: the punktfunk release key is imported AND locally signed in the pacman keyring
              id: punktfunk-repo-key-trusted
              # Asserts TRUST, not mere presence: `pub:f:` is full validity, which the key
              # only reaches once `pacman-key --lsign-key` has signed it. An imported but
              # unsigned key would still let the repo be listed while every package
              # install failed signature verification, so presence alone proves nothing.
              #
              # Queried through gpg against the pacman keyring rather than `pacman-key`:
              # pacman-key does its own option parsing and rejects --with-colons. This is
              # the same idiom the pac install template itself uses to find the key.
              # The fingerprint is inlined rather than carried in `var:` because `var:` is
              # a build-time ENV and would be empty on a VM/host deploy.
              exit_status: 0
              command: |
                gpg --homedir /etc/pacman.d/gnupg --batch --list-keys --with-colons \
                    E0CA04465C99C936E0B0C6510A317015A34DDD69 2>/dev/null | grep -q '^pub:f:'
            - check: the punktfunk repo stanza is present in pacman.conf
              id: punktfunk-repo-stanza
              file:
                file: /etc/pacman.conf
                contains:
                    - contains: "[punktfunk]"
            - check: the host.env policy file pins the software encoder and virtual source
              id: punktfunk-host-env
              file:
                file: "${HOME}/.config/punktfunk/host.env"
                exists: true
                contains:
                    - contains: "PUNKTFUNK_VIDEO_SOURCE=virtual"
                    - contains: "PUNKTFUNK_ENCODER=software"
            - check: the container-venue launcher wrapper is installed and executable where it is the launch path
              id: punktfunk-wrapper-installed
              # Scoped to the venue the wrapper exists FOR. It is the launch path only
              # under a container init, because supervisord cannot use the packaged
              # systemd user unit; on a systemd venue that unit is the launch path and the
              # wrapper has no role, so asserting it there would assert an artifact whose
              # absence means nothing. Reports an explicit N/A rather than passing mute.
              exit_status: 0
              stdout:
                - contains: "PUNKTFUNK-WRAPPER"
              command: |
                if [ -d /run/systemd/system ]; then
                  echo "PUNKTFUNK-WRAPPER-NA (systemd venue: the packaged user unit is the launch path)"
                  exit 0
                fi
                if [ -x "$HOME/.local/bin/punktfunk-host-wrapper" ]; then
                  echo "PUNKTFUNK-WRAPPER-OK"
                else
                  echo "punktfunk: the container-venue wrapper is missing or not executable" >&2
                  exit 1
                fi
            - check: the punktfunk host user unit is enabled on a systemd venue
              id: punktfunk-user-unit-enabled
              # The claim a supervisord container structurally cannot make: the PACKAGED
              # systemd user unit is installed and enabled for the deploying account.
              # Gated on systemd being the running init so the same candy stays honest in
              # a container, where it reports N/A rather than failing.
              context:
                - runtime
              exit_status: 0
              stdout:
                - contains: "PUNKTFUNK-USER-UNIT"
              command: |
                if [ ! -d /run/systemd/system ]; then
                  echo "PUNKTFUNK-USER-UNIT-NA (no running systemd; the container venue runs the wrapper instead)"
                  exit 0
                fi
                PF_USER="$(getent passwd 1000 | cut -d: -f1)"
                # `runuser -u <user> -- systemctl --user` does NOT work: it reaches no user
                # bus and systemd says so itself — "Failed to connect to user scope bus ...
                # consider using --machine=<user>@.host --user". Measured on a live guest;
                # --machine is the prescribed way to query another user's manager.
                if loginctl show-user "$PF_USER" -p Linger 2>/dev/null | grep -q 'Linger=yes' &&
                   systemctl --machine="$PF_USER@.host" --user is-enabled punktfunk-host.service >/dev/null 2>&1; then
                  echo "PUNKTFUNK-USER-UNIT-OK (lingering + unit enabled for $PF_USER)"
                else
                  echo "punktfunk: lingering or the user unit is not enabled for $PF_USER" >&2
                  exit 1
                fi
            - check: the web console answers inside the venue, so the advertised port is not a promise the venue breaks
              id: punktfunk-web-console-live
              # The candy declares https+insecure:47992 unconditionally. Before the console
              # had a container service form, a pod deploy published that port with nothing
              # listening on it — installed, advertised, never started. This check fails in
              # exactly that situation, on either venue.
              # -k because the console serves the host's self-signed identity cert.
              # The console waits on the host's mgmt token + cert, so give it room.
              context:
                - runtime
              exit_status: 0
              eventually: 120s
              retry_interval: 5s
              command: |
                curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:47992/ | grep -qE '^(200|30[0-9]|401)$'
            - check: the management API answers inside the venue, which proves the host actually reached serve
              id: punktfunk-mgmt-api-live
              # The BEHAVIOURAL gate on the launch path. The file/mode check above would
              # still pass if the wrapper's waits, its host.env sourcing or its exec were
              # broken; this one would not — the API only answers once something has
              # actually exec'd `punktfunk-host serve`. Venue-independent on purpose: in a
              # container that something is the wrapper, on a systemd venue it is the
              # packaged user unit, and the same assertion covers both.
              # -k because the management API serves a self-signed certificate.
              context:
                - runtime
              exit_status: 0
              stdout:
                - contains: '"status":"ok"'
              command: curl -sk https://127.0.0.1:47990/api/v1/health

punktfunk-host-skill:
    skill:
        name: punktfunk-host
        family: punktfunk
        owner: punktfunk
        description: |-
            The punktfunk streaming host — the `punktfunk/1` QUIC host daemon, its browser
            console and its plugin runner, installed from unom's signed pacman repo on
            Arch/CachyOS. MUST be invoked before authoring or editing a punktfunk deploy,
            the punktfunk-host image, or either punktfunk check bed.
        triggers:
            - "punktfunk / game streaming host / Moonlight-compatible host / `punktfunk-host` units"
        content: |
            # punktfunk — the streaming host

            [punktfunk](https://git.unom.io/unom/punktfunk) is a Rust game/desktop
            streaming **host daemon**: a native `punktfunk/1` QUIC protocol plus
            Moonlight/GameStream compatibility. It is a different axis from the
            `selkies-*` / `wayvnc` / `sway-*` corpus, which streams a *desktop out of a
            container* over WebRTC/VNC — punktfunk is a host with its own protocol and a
            management plane.

            ## What the candy installs

            | Item | Value |
            |---|---|
            | Packages | `punktfunk-host`, `punktfunk-web`, `punktfunk-scripting` |
            | Repo | `[punktfunk]` in `/etc/pacman.conf`, `SigLevel = Required DatabaseOptional` |
            | Key | fetched + `pacman-key --lsign-key`'d; fingerprint `E0CA04465C99C936E0B0C6510A317015A34DDD69` |
            | Ports | `udp:9777` (native QUIC), `https+insecure:47990` (management API), `https+insecure:47992` (web console) |
            | Config | `~/.config/punktfunk/host.env` |
            | Distros | Arch **and** CachyOS — one `distro.arch:` section; the cachyos base declares `distro: [cachyos, arch]` |

            The `Server` line carries pacman's own `$repo` / `$arch` variables. That is
            deliberate and works because the pac install template emits the line inside a
            single-quoted `printf`, so they reach `pacman.conf` verbatim for pacman to
            expand. Do not "fix" them into literals.

            ## Two service forms, because punktfunk is a systemd USER service

            This is the single most important thing to understand before editing the candy.

            - **systemd venue** (VM / host deploy): the packaged `punktfunk-host`,
              `punktfunk-web` and `punktfunk-scripting` units are enabled with
              `scope: user`.
            - **container venue**: supervisord cannot use a systemd user unit, so the host
              runs through the candy's own `punktfunk-host-wrapper`.

            The wrapper waits for the Wayland socket and then **sway's IPC socket** before
            exec'ing the host. That wait is load-bearing: punktfunk creates its virtual
            output by calling `swaymsg create_output`, so a host started before sway is
            listening runs but can never produce a display. It also sources `host.env`,
            which supervisord (unlike the packaged unit) does not read.

            The wrapper mirrors `pod-wayvnc`'s `wayvnc-wrapper` deliberately — same
            dependency, same venue, one readiness idiom in the repo rather than two.

            ## Lingering is part of installing it correctly

            A `scope: user` unit only runs without an interactive login if the account
            lingers, and charly's deploy path does not enable lingering on its own. The
            candy does it, capability-gated on `/run/systemd/system` so it no-ops during an
            image build and in a container, where there are no user units anyway.

            ## host.env pins, and why

            ```
            PUNKTFUNK_COMPOSITOR=wlroots
            PUNKTFUNK_INPUT_BACKEND=wlr
            PUNKTFUNK_VIDEO_SOURCE=virtual
            PUNKTFUNK_ENCODER=software
            PUNKTFUNK_ZEROCOPY=0
            PUNKTFUNK_MGMT_BIND=127.0.0.1:47990
            ```

            Pinned rather than auto-detected on purpose: auto-detection picks whatever
            compositor is live, which would make a bed's result depend on the venue instead
            of on the config. `software` + `ZEROCOPY=0` is the only honest encoder path on
            a GPU-less bed; a GPU deploy overrides both in its own overlay. The host binds
            the management API to loopback — that is punktfunk's own posture, and the
            `punktfunk:` verb probes from inside the venue rather than relaxing it.

            **Never `setcap` `punktfunk-host`.** Upstream is explicit: capabilities belong
            on `punktfunk-encode-worker`, and setcap on the host breaks KDE desktop capture.

            ## The token file is not a bare token

            `~/.config/punktfunk/mgmt-token` is an env-file line, despite the docs implying
            otherwise:

            ```
            PUNKTFUNK_MGMT_TOKEN=<64-hex-token>
            ```

            Sending the whole line as a bearer yields a clean HTTP 401. `/charly-check:punktfunk`
            parses it.

            ## Beds

            Two, because one venue cannot prove both halves:

            - `check-punktfunk-pod` — the container venue (the wrapper launch path) and the
              only place the `punktfunk:` verb's live dispatch is exercised.
            - `check-punktfunk-vm` — the systemd venue: the packaged user unit, lingering,
              and the management plane under a real init.

            Both live in `opencharly/distro-cachyos`; run them with
            `charly -C box/cachyos check run check-punktfunk-pod` (or `…-vm`).

            ## Cross-References

            - `/charly-check:punktfunk` — the `punktfunk:` verb that probes and manages a running host
            - `/charly-selkies:sway` — the compositor the container venue depends on
            - `/charly-check:check` — beds, `disposable: true`, the R10 sequence
            - `/charly-image:layer` — candy authoring (the `distro:` cascade, `service:` forms)
