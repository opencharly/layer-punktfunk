# Gate the candy manifest against the pinned charly.
name: candy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: candy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the pinned charly source (CI-time temp checkout)
        run: |
          git clone --depth 1 --branch v2026.241.1535 https://github.com/opencharly/charly.git /tmp/charly

      - uses: actions/setup-go@v5
        with:
          go-version-file: /tmp/charly/charly/go.mod
          cache-dependency-path: /tmp/charly/charly/go.sum

      - name: Build the charly binary from the pinned checkout
        run: |
          mkdir -p /tmp/charly/bin
          cd /tmp/charly/charly && go build -buildvcs=false -ldflags "-X main.BuildCalVer=candy-ci" -o /tmp/charly/bin/charly .

      - name: The candy manifest validates at the pinned charly
        run: |
          /tmp/charly/bin/charly box validate

      - name: The container-venue wrappers behave
        # The wrappers ARE the container venue's launch path (supervisord cannot use a
        # systemd USER unit), so their behaviour needs a gate. Drives the shipped scripts
        # against stubs: the readiness gate, the env-file sourcing, the exports the
        # packaged units set, and reaching exec.
        run: |
          sh test/wrappers.sh
